<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataStandard — MCP Enterprise Data Preprocessing & Database Engine</title>
    <link rel="stylesheet" href="styles.css?v=3.4">
    
    <!-- 100% LOCAL React 18 (Instant load, no external CDNs or internet connection needed) -->
    <script src="vendor/react.min.js"></script>
    <script src="vendor/react-dom.min.js"></script>
</head>
<body>
    <div id="root">
        <!-- Fallback loader while React mounts -->
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #475569; background: #f8fafc;">
            <div style="width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top: 3px solid #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <div style="margin-top: 14px; font-weight: 600; font-size: 14px; letter-spacing: -0.2px;">Starting Local MCP Dashboard...</div>
        </div>
        <style>
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
    </div>

    <!-- Error handler to show exact error if anything fails -->
    <script>
        window.addEventListener('error', function(e) {
            console.error('Frontend error:', e);
            var root = document.getElementById('root');
            if (root && root.innerText && root.innerText.indexOf('Starting') !== -1) {
                root.innerHTML = '<div style="padding: 24px; font-family: sans-serif; color: #dc2626; max-width: 650px; margin: 40px auto; background: #fff; border: 1px solid #fecaca; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">' +
                    '<h3 style="margin-bottom: 8px;">Script Error</h3>' +
                    '<p style="font-size: 14px; color: #334155;">' + (e.message || 'Unknown error') + '</p>' +
                    '<pre style="background: #f8fafc; padding: 10px; border-radius: 6px; font-size: 12px; margin-top: 12px; overflow-x: auto;">Source: ' + (e.filename || 'app.bundle.js') + ' : Line ' + (e.lineno || '?') + '</pre>' +
                '</div>';
            }
        });
    </script>

    <!-- React Application pre-compiled for instant local execution without Babel overhead -->
    <script src="app.bundle.js?v=3.8"></script>
</body>
</html>
